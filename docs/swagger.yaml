  name: Auth
- description: Organization management, roles, members, API keys.
  name: Organizations
- description: Subscription and billing management.
  name: Billing
- description: CRM & Revenue Operations — leads, quotes, risk analysis.
  name: CRM
- description: Finance & Enterprise Accounting — journal entries, invoices, expenses.
  name: Accounting
- description: Fleet & Telematics — vehicle telemetry, route optimization.
  name: Fleet
- description: Supply Chain & Inventory — reorder predictions, stock management.
  name: Inventory
- description: HR, Workforce & Collaboration — attendance, ATS, knowledge base search.
  name: HR
- description: Platform, AI Core & BI — text-to-SQL copilot, workflow automation,
    security audit anomalies.
  name: AI & Platform
- description: System observability, SOC monitoring, partitioned maintenance, and
    CI health.
  name: Super Admin
