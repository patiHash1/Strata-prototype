securityDefinitions:
  ApiKeyAuth:
    description: API key for programmatic access (e.g. fleet telematics ingestion)
    in: header
    name: X-API-Key
    type: apiKey
  BearerAuth:
    description: 'Enter your Bearer token in the format: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
