services:
  postgres:
    image: postgres:16-alpine
    container_name: strata-db-test
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: strata-user
      POSTGRES_PASSWORD: strata-pass
      POSTGRES_DB: strata-db-beta
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strata-user -d strata-db-beta"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: strata-redis-test
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-strata-redis-pass}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-strata-redis-pass}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata: